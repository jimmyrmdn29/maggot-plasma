<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Magfeed - Admin Management System">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Magfeed Admin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Magfeed Admin</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Loading Spinner Sederhana */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    .loader {
      border: 16px solid #f3f3f3;
      border-radius: 50%;
      border-top: 16px solid #1a237e; /* Warna Indigo sesuai Dashboard Admin */
      width: 80px;
      height: 80px;
      animation: spin 2s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading">
    <div class="loader"></div>
  </div>

  <script>
    // JURUS AMPUH: Hapus Service Worker lama yang nyangkut di browser
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }

    // Paksa browser download file kodingan terbaru (main.dart.js)
    // Menambahkan variabel waktu agar URL selalu dianggap baru oleh browser
    var script = document.createElement('script');
    script.src = "main.dart.js?v=" + new Date().getTime();
    script.type = "application/javascript";
    document.body.appendChild(script);
  </script>
</body>
</html>
